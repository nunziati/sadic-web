version: '3.8'

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    privileged: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/server.crt:/etc/nginx/ssl/server.crt
      - ./nginx/server.key:/etc/nginx/ssl/server.key
      - ./sadicweb/static:/opt/static_root
    depends_on:
      - sadicweb
    restart: always
    env_file: .env

  sadicweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sadicweb
    privileged: true
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      PROJECT_ROOT: ${PROJECT_ROOT}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: ${DB_PORT}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DB_URL: "mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"         
    ports:
      - "8000:8000"
    depends_on:
      - mariadb
    restart: always
    env_file: .env

  mariadb:
    privileged: true
    image: mariadb:latest
    container_name: sadic_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    env_file: .env

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    links:
      - mariadb
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_ARBITRARY: ${PMA_ARBITRARY}
    ports:
      - 8081:80
    restart: always
    env_file: .env

volumes:
  mariadb_data:
